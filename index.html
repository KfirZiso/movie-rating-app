<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת לחיזוי דירוג סרטים</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 650px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="number"], select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #219a52; }
        .result-box { margin-top: 25px; padding: 15px; background-color: #e8f8f5; border-right: 5px solid #2cc990; border-radius: 4px; text-align: center; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>חיזוי דירוג סרטים (חלק 3)</h1>
    <p style="text-align: center;">הזינו את פרמטרי הסרט כדי לקבל תחזית לדירוג הממוצע בזמן אמת</p>
    
    <form action="/" method="post">
        
        <div class="grid-2">
            <div class="form-group">
                <label for="runtimeMinutes">אורך הסרט (בדקות):</label>
                <input type="number" id="runtimeMinutes" name="runtimeMinutes" value="100" required min="1">
            </div>
            
            <div class="form-group">
                <label for="genre_count">מספר ז'אנרים משויכים:</label>
                <input type="number" id="genre_count" name="genre_count" value="2" required min="1">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="num_a_list_actors">מספר שחקני מדרג א' (A-List):</label>
                <input type="number" id="num_a_list_actors" name="num_a_list_actors" value="1" required min="0">
            </div>
            
            <div class="form-group">
                <label for="runtime_category_num">קטגוריית אורך (מספרי):</label>
                <input type="number" id="runtime_category_num" name="runtime_category_num" value="1" required min="0">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="is_post_imdb">האם הסרט הופק לאחר הקמת IMDb?</label>
                <select id="is_post_imdb" name="is_post_imdb">
                    <option value="1">כן (1)</option>
                    <option value="0">לא (0)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="is_english">האם השפה המרכזית היא אנגלית?</label>
                <select id="is_english" name="is_english">
                    <option value="1">כן (1)</option>
                    <option value="0">לא (0)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="is_usa">האם הסרט הופק בארה"ב?</label>
            <select id="is_usa" name="is_usa">
                <option value="1">כן (1)</option>
                <option value="0">לא (0)</option>
            </select>
        </div>

        <h3 style="border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; margin-top: 20px; color: #7f8c8d;">בחירת ז'אנרים (סמנו 1 אם קיים, 0 אם לא):</h3>
        
        <div class="grid-2">
            <div class="form-group">
                <label for="genre_Action">פעולה (Action):</label>
                <select id="genre_Action" name="genre_Action"><option value="0">לא</option><option value="1">כן</option></select>
            </div>
            <div class="form-group">
                <label for="genre_Comedy">קומדיה (Comedy):</label>
                <select id="genre_Comedy" name="genre_Comedy"><option value="0">לא</option><option value="1">כן</option></select>
            </div>
            <div class="form-group">
                <label for="genre_Drama">דרמה (Drama):</label>
                <select id="genre_Drama" name="genre_Drama"><option value="1">כן</option><option value="0">לא</option></select>
            </div>
            <div class="form-group">
                <label for="genre_Thriller">מתח (Thriller):</label>
                <select id="genre_Thriller" name="genre_Thriller"><option value="0">לא</option><option value="1">כן</option></select>
            </div>
            <div class="form-group">
                <label for="genre_Romance">רומנטיקה (Romance):</label>
                <select id="genre_Romance" name="genre_Romance"><option value="0">לא</option><option value="1">כן</option></select>
            </div>
            <div class="form-group">
                <label for="genre_Sci-Fi">מדע בדיוני (Sci-Fi):</label>
                <select id="genre_Sci-Fi" name="genre_Sci-Fi"><option value="0">לא</option><option value="1">כן</option></select>
            </div>
            <div class="form-group">
                <label for="genre_Horror">אימה (Horror):</label>
                <select id="genre_Horror" name="genre_Horror"><option value="0">לא</option><option value="1">כן</option></select>
            </div>
            <div class="form-group">
                <label for="genre_Documentary">דוקומנטרי (Documentary):</label>
                <select id="genre_Documentary" name="genre_Documentary"><option value="0">לא</option><option value="1">כן</option></select>
            </div>
        </div>

        <button type="submit">חשב תחזית לדירוג הסרט (Predict)</button>
    </form>

    {% if prediction is not none %}
        <div class="result-box">
            הדירוג המשוער של המודל עבור הסרט הוא: <span style="color: #27ae60; font-size: 24px;">{{ prediction }}</span>
        </div>
    {% endif %}
</div>

</body>
</html>
