<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>מערכת לחיזוי דירוג סרטים</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 650px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; position: relative; }
        label { font-weight: bold; margin-bottom: 5px; color: #34495e; }
        input[type="text"], select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; width: 100%; box-sizing: border-box; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background-color: #219a52; }
        .result-box { margin-top: 25px; padding: 15px; background-color: #e8f8f5; border-right: 5px solid #2cc990; border-radius: 4px; text-align: center; font-size: 18px; font-weight: bold; display: none; }
        
        /* עיצוב הודעות השגיאה הדינמיות מתחת לשדות הקלט */
        .error-message { color: #e74c3c; font-size: 13px; margin-top: 5px; font-weight: bold; display: none; }
        .input-error { border-color: #e74c3c !important; background-color: #fdf2f2; }

        .genres-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .genre-item { display: flex; align-items: center; gap: 10px; background: #f9f9f9; padding: 8px; border-radius: 4px; border: 1px solid #eee; }
        .genre-item input { width: 18px; height: 18px; cursor: pointer; }
        .genre-item label { margin: 0; cursor: pointer; font-weight: normal; }
    </style>
</head>
<body>

<div class="container">
    <h1>חיזוי דירוג סרטים (חלק 3)</h1>
    <p style="text-align: center;">הזינו את פרמטרי הסרט המקוריים כדי לקבל תחזית לדירוג בזמן אמת</p>
    
    <form id="movieForm">
        <div class="grid-2">
            <div class="form-group">
                <label for="runtimeMinutes">אורך הסרט (בדקות):</label>
                <input type="text" id="runtimeMinutes" placeholder="לדוגמה: 120">
                <span id="error-runtimeMinutes" class="error-message"></span>
            </div>
            
            <div class="form-group">
                <label for="num_a_list_actors">מספר שחקני מדרג א' (A-List):</label>
                <input type="text" id="num_a_list_actors" placeholder="לדוגמה: 2">
                <span id="error-num_a_list_actors" class="error-message"></span>
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label for="is_post_imdb">האם הסרט הופק לאחר הקמת IMDb?</label>
                <select id="is_post_imdb">
                    <option value="" disabled selected hidden>בחר אפשרות...</option>
                    <option value="1">כן</option>
                    <option value="0">לא</option>
                </select>
                <span id="error-is_post_imdb" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="is_english">האם השפה המרכזית היא אנגלית?</label>
                <select id="is_english">
                    <option value="" disabled selected hidden>בחר אפשרות...</option>
                    <option value="1">כן</option>
                    <option value="0">לא</option>
                </select>
                <span id="error-is_english" class="error-message"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="is_usa">האם הסרט הופק בארה"ב?</label>
            <select id="is_usa">
                <option value="" disabled selected hidden>בחר אפשרות...</option>
                <option value="1">כן</option>
                <option value="0">לא</option>
            </select>
            <span id="error-is_usa" class="error-message"></span>
        </div>

        <h3 style="border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; margin-top: 20px; color: #7f8c8d;">בחרו את ז'אנרי הסרט:</h3>
        
        <div class="genres-container">
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Action" id="genre_Action"><label for="genre_Action">פעולה (Action)</label></div>
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Comedy" id="genre_Comedy"><label for="genre_Comedy">קומדיה (Comedy)</label></div>
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Drama" id="genre_Drama"><label for="genre_Drama">דרמה (Drama)</label></div>
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Thriller" id="genre_Thriller"><label for="genre_Thriller">מתח (Thriller)</label></div>
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Romance" id="genre_Romance"><label for="genre_Romance">רומנטיקה (Romance)</label></div>
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Sci-Fi" id="genre_Sci-Fi"><label for="genre_Sci-Fi">מדע בדיוני (Sci-Fi)</label></div>
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Horror" id="genre_Horror"><label for="genre_Horror">אימה (Horror)</label></div>
            <div class="genre-item"><input type="checkbox" name="genres" value="genre_Documentary" id="genre_Documentary"><label for="genre_Documentary">דוקומנטרי (Documentary)</label></div>
        </div>

        <button type="submit">חשב תחזית לדירוג הסרט (Predict)</button>
    </form>

    <div id="resultBox" class="result-box">
        <span id="predictionValue"></span>
    </div>
</div>

<script>
document.getElementById('movieForm').addEventListener('submit', function(e) {
    e.preventDefault(); // מניעת רענון עמוד אוטומטי
    
    // ניקוי ואיפוס כל עיצובי והודעות השגיאה הקודמות מהמסך
    document.querySelectorAll('.error-message').forEach(el => { el.style.display = 'none'; el.innerText = ''; });
    document.querySelectorAll('input[type="text"], select').forEach(el => el.classList.remove('input-error'));
    document.getElementById('resultBox').style.display = 'none';
    
    // איסוף ז'אנרים שנבחרו
    let checkedGenres = [];
    document.querySelectorAll('input[name="genres"]:checked').forEach(cb => {
        checkedGenres.push(cb.value);
    });

    // בניית גוף הנתונים לשליחה בפורמט JSON
    let movieData = {
        runtimeMinutes: document.getElementById('runtimeMinutes').value,
        num_a_list_actors: document.getElementById('num_a_list_actors').value,
        is_post_imdb: document.getElementById('is_post_imdb').value,
        is_english: document.getElementById('is_english').value,
        is_usa: document.getElementById('is_usa').value,
        genres: checkedGenres
    };

    let statusCode = 200;

    // שליחת בקשת POST אסינכרונית לשרת ה-Flask
    fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(movieData)
    })
    .then(response => {
        statusCode = response.status; // שמירת קוד הסטטוס (200, 400, 500)
        return response.json();
    })
    .then(data => {
        let resultBox = document.getElementById('resultBox');
        let predSpan = document.getElementById('predictionValue');
        
        if (statusCode === 200) {
            // מקרה הצלחה: מציג את הניבוי בקופסה ירוקה בתחתית
            resultBox.style.backgroundColor = '#e8f8f5';
            resultBox.style.borderRight = '5px solid #2cc990';
            predSpan.innerHTML = `הדירוג המשוער של המודל עבור הסרט הוא: <span style="color: #27ae60; font-size: 24px;">${data.predicted_rating}</span>`;
            resultBox.style.display = 'block';
        } else {
            // מקרה שגיאה: (סטטוס 400) - בדיקה האם חזרו שדות ספציפיים שכשלו
            if (data.invalid_fields) {
                // רצים בלולאה על כל השדות הפגומים שחזרו מה-API ומאירים את כולם באדום במקביל
                Object.keys(data.invalid_fields).forEach(fieldId => {
                    if (document.getElementById(fieldId)) {
                        let inputElement = document.getElementById(fieldId);
                        let errorSpan = document.getElementById('error-' + fieldId);
                        let fieldErrorMessage = data.invalid_fields[fieldId];
                        
                        inputElement.classList.add('input-error');
                        errorSpan.innerHTML = `Status Code: ${statusCode} - ${fieldErrorMessage}`;
                        errorSpan.style.display = 'block';
                    }
                });
            } else {
                // מקרה קריסה פנימית: (סטטוס 500) - מציג הודעה כללית בקופסה אדומה בתחתית
                resultBox.style.backgroundColor = '#fce4d6';
                resultBox.style.borderRight = '5px solid #e74c3c';
                predSpan.innerHTML = `<span style="color: #c0392b; font-weight: bold; font-size: 18px;">Status Code: ${statusCode}</span><br><span style="font-size: 15px; color: #333;">${data.error}</span>`;
                resultBox.style.display = 'block';
            }
        }
    })
    .catch(error => {
        console.error('Fetch operation error:', error);
    });
});
</script>

</body>
</html>
